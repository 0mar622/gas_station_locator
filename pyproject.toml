[project]
name = "gas-station-locator"
version = "0.1.0"
description = "MVP web app for finding reachable, cost-effective gas stations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "folium>=0.19.0",
    "google-auth>=2.58.1",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
